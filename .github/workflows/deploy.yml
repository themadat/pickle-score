name: Deploy to GitHub Pages

# Production:  main   -> https://themadat.github.io/pickle-score/
# Beta:        beta   -> https://themadat.github.io/pickle-score/beta/
# Alpha:       alpha  -> https://themadat.github.io/pickle-score/alpha/
#
# GitHub Pages must be configured with Source = GitHub Actions.
# Each deploy assembles the full Pages artifact and replaces only the current
# channel so beta/alpha/main deploys do not wipe each other.

on:
  push:
    branches:
      - main
      - beta
      - alpha
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout existing Pages site
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: published

      - name: Decide destination subfolder
        id: dest
        run: |
          case "${{ github.ref_name }}" in
            main)
              echo "dir=." >> "$GITHUB_OUTPUT"
              echo "label=production" >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "dir=beta" >> "$GITHUB_OUTPUT"
              echo "label=beta" >> "$GITHUB_OUTPUT"
              ;;
            alpha)
              echo "dir=alpha" >> "$GITHUB_OUTPUT"
              echo "label=alpha" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${{ github.ref_name }}" >&2
              exit 1
              ;;
          esac

      - name: Assemble Pages artifact
        env:
          DEST_DIR: ${{ steps.dest.outputs.dir }}
        run: |
          set -eu

          mkdir -p _site

          if [ -d published ]; then
            cp -a published/. _site/
            rm -rf _site/.git
          fi

          copy_source() {
            target="$1"
            mkdir -p "$target"
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='.claude' \
              --exclude='.vscode' \
              --exclude='build' \
              --exclude='context' \
              --exclude='SCRATCHPAD.md' \
              source/ "$target/"
          }

          if [ "$DEST_DIR" = "." ]; then
            find _site -mindepth 1 -maxdepth 1 \
              ! -name beta \
              ! -name alpha \
              ! -name CNAME \
              -exec rm -rf {} +
            copy_source _site
          else
            rm -rf "_site/$DEST_DIR"
            copy_source "_site/$DEST_DIR"
          fi

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Give Pages artifact processing a moment
        run: sleep 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
          error_count: 20
          reporting_interval: 10000
